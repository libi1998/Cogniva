# Resta solo main: il ramo di una pull request si cancella appena ne è fatto
# il merge. Si può anche cancellare un ramo a mano da Actions › Pulizia rami ›
# Run workflow, con il suo nome.
name: Pulizia rami

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      branch:
        description: "Ramo da cancellare"
        required: true

permissions:
  contents: write

jobs:
  delete:
    # solo dopo un merge, e solo per i rami di questo repository
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # il nome passa solo per l'ambiente, mai dentro lo script
      BRANCH: ${{ inputs.branch || github.event.pull_request.head.ref }}
      DEFAULT: ${{ github.event.repository.default_branch }}
    steps:
      - name: Cancella il ramo
        run: |
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "$DEFAULT" ] || [ "$BRANCH" = "main" ]; then
            echo "Il ramo «$BRANCH» non si cancella"
            exit 1
          fi
          # un ramo già cancellato non è un errore
          if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"; then
            echo "Ramo $BRANCH cancellato"
          else
            echo "Il ramo $BRANCH non c'è più"
          fi
