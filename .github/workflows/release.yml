# Pubblica una release quando si carica un tag di versione (vX.Y.Z): il titolo
# è «Cogniva vX.Y.Z», le note sono quelle scritte in .github/release-notes.md.
#
#   git tag -a v1.2.0 -m "Cogniva v1.2.0" && git push origin v1.2.0
#
# Oppure a mano da Actions › Release › Run workflow, con la versione: il tag
# si crea sull'ultimo commit del ramo scelto.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Versione da pubblicare (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # dall'input passa solo per l'ambiente, mai dentro lo script
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Pubblica la release
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "«$TAG» non è una versione vX.Y.Z"
            exit 1
          fi
          # un tag già pubblicato a mano non si tocca
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release $TAG esiste già"
            exit 0
          fi
          # dal tag caricato si pubblica quello; a mano il tag nasce qui
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            where=(--verify-tag)
          else
            where=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            "${where[@]}" --latest \
            --title "Cogniva $TAG" \
            --notes-file .github/release-notes.md
